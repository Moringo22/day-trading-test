name: Test day trading

on:
  schedule:
    # Heures UTC. En hiver (UTC-5) : toutes les 15 min de 9 h à 16 h 45 à Montréal, lundi au vendredi.
    - cron: "*/15 14-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daytrade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      TZ: America/Toronto
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Télécharger les bougies et simuler
        run: python run.py

      - name: Enregistrer les résultats
        if: always()
        run: |
          git config user.name "daytrade-bot"
          git config user.email "daytrade-bot@users.noreply.github.com"
          git add data trades.csv docs/data.json run_log.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -q -m "Test : $(date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
