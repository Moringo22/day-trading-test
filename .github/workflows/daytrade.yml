name: Test day trading

# Une tâche « séance » tourne en boucle pendant la bourse : mise à jour toutes les 5 minutes.
# Les tâches planifiées de GitHub sont peu fiables : plusieurs départs sont prévus ; si une boucle
# tourne déjà, les suivantes attendent (concurrence) puis font une seule mise à jour et s'arrêtent.
# Une boucle qui atteint la limite de temps de GitHub se relance elle-même si la séance n'est pas finie.

on:
  schedule:
    # Heures UTC, minutes décalées. En hiver (UTC-5) : départs possibles de 8 h 41 à 15 h 41 à Montréal.
    - cron: "41 13 * * 1-5"
    - cron: "11,41 14-20 * * 1-5"
    - cron: "23 21 * * 1-5"   # filet : mise à jour après la clôture
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daytrade
  cancel-in-progress: false

jobs:
  seance:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONIOENCODING: utf-8
      TZ: America/New_York
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Boucle de séance (toutes les 5 min jusqu'à 16 h 10, heure de New York)
        run: |
          git config user.name "daytrade-bot"
          git config user.email "daytrade-bot@users.noreply.github.com"
          START=$(date +%s)   # compte depuis le début de la tâche (limite GitHub : 6 h)
          # Départ avant l'ouverture : attendre 9 h 35 min 40 s (première bougie complète après l'ouverture)
          if [ "$(date +%u)" -le 5 ] && [ "$(date +%H%M)" -ge 0800 ] && [ "$(date +%H%M)" -lt 0935 ]; then
            W=$(( $(date -d "today 09:35:40" +%s) - $(date +%s) )); echo "Attente de l'ouverture : ${W}s"; sleep $W
          fi
          while true; do
            python run.py || echo "run.py a échoué, on continue"
            git add data trades.csv docs/data.json run_log.txt 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "Test : $(date '+%Y-%m-%d %H:%M')"
              for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
            fi
            NOW=$(date +%s); HM=$(date +%H%M); DOW=$(date +%u)
            # Fin : week-end, après 16 h 10, ou avant 8 h (départ en pleine nuit : une seule mise à jour)
            if [ "$DOW" -ge 6 ] || [ "$HM" -ge 1610 ] || [ "$HM" -lt 0800 ]; then
              echo "Hors séance : fin de la boucle."; break
            fi
            if [ $((NOW - START)) -ge 20400 ]; then   # 5 h 40 : relance une nouvelle boucle
              echo "Limite de temps proche : relance."
              gh workflow run daytrade.yml --ref main || true
              break
            fi
            # Attendre la prochaine bougie complète (multiple de 5 min + 40 s)
            S=$(( 300 - (NOW % 300) + 40 ))
            sleep $S
          done
